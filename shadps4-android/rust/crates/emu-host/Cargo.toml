[package]
name = "shadps4-emu-host"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "shadps4_emu_host"

[dependencies]
shadps4-library = { path = "../library" }
shadps4-driver-mgr = { path = "../driver-mgr" }
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1.0"
lazy_static = "1.4"
tracing = "0.1"
android_logger = "0.13"
log = "0.4"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
